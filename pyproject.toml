[project]
name = "capti"
# Version wird zentral in version.py gepflegt und hier gespiegelt.
version = "2.0.0"
description = "Capti 2.0 – lokale KI-Untertitel für Videos und Shorts mit Caption Styles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ctranslate2>=4.8.1",
    "customtkinter>=6.0.0",
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6.0",
    "tkinterdnd2>=0.6.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
